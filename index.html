<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121417);--bg2:light-dark(#f3f4f2,#1a1d21);--ink:light-dark(#161a1d,#e9ecef);--mute:light-dark(#5c6670,#9aa3ad);--line:light-dark(#dde1e0,#2b3137);--acc:light-dark(#1f5f4a,#7fd1b0);--card:light-dark(#fff,#181b1f)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;padding:16px max(3vw,14px) 10px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div b{display:block;font-size:20px;line-height:1.1}
.stats div span{font-size:12px;color:var(--mute)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 84px);min-height:560px}
#map{height:100%;z-index:1}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label{font-size:12px;color:var(--mute);display:grid;gap:3px}
.filters .full{grid-column:1/-1}
select,input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);padding:0 10px;font-size:16px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{overflow:auto;flex:1}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.item:hover,.item.on{background:var(--bg2)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;border:2px solid #0003}
.item b{font-size:15px}
.item .m{font-size:13px;color:var(--mute)}
.price{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:1px 7px;background:var(--bg2);border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.legend{background:var(--card);color:var(--ink);padding:8px 10px;border-radius:8px;box-shadow:0 2px 10px #0003;font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.leaflet-popup-content{font:14px/1.5 "Be Vietnam Pro",system-ui,sans-serif;margin:12px 14px}
.pop h3{margin:0 0 4px;font-size:16px}
.pop table{border-collapse:collapse;width:100%;font-size:13px}
.pop td{padding:2px 0;vertical-align:top}.pop td:first-child{color:#667;padding-right:10px;white-space:nowrap}
.news{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.news b{display:block;margin-bottom:2px}
footer{padding:16px max(3vw,14px);font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
.empty{padding:24px 14px;color:var(--mute)}
@media(max-width:860px){.layout{grid-template-columns:1fr;height:auto}#map{height:58vh}aside{border-left:0}.list{max-height:none;overflow:visible}header{align-items:flex-start}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:0 12px;height:32px;font-size:13px;font-weight:600;cursor:pointer;min-width:44px}
.lang button.on{background:var(--ink);color:var(--bg)}
</style>
</head>

/* ---------- Quy đổi USD (chỉ bản tiếng Anh) / USD conversion (English only) ---------- */
let RATE = null;   // {usd_vnd, date, ...}
const useUSD = () => lang === "en" && RATE && RATE.usd_vnd > 0;
const usdM2 = v => Math.round(v * 1e6 / RATE.usd_vnd / 10) * 10;          // triệu đ/m² → USD/m² (làm tròn 10)
const P = v => v == null ? "—" : useUSD() ? "$" + usdM2(v).toLocaleString("en-US") : fmt(v);   // số giá (không đơn vị)
const UN = () => useUSD() ? "USD/m²" : t("unit");                          // tên đơn vị
const PU = v => v == null ? "" : useUSD() ? P(v) + "/m²" : `${fmt(v)} ${t("unit")}`;            // giá kèm đơn vị
const VNDnote = txt => useUSD() ? ` (${txt} M VND/m²)` : "";
const TOTAL = v => { if (v == null) return ""; if (!useUSD()) return `${fmt(v)} ${t("bn")}`;
  const u = v * 1e9 / RATE.usd_vnd; return `US$${(u / 1e6).toLocaleString("en-US", {maximumFractionDigits: 1})} million (${fmt(v)} bn VND)`; };
const U = k => t(k).replace("{u}", UN());

function parseCSV(s) {
  const rows = []; let row = [], cell = "", q = false;
  s = s.replace(/^﻿/, "");
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && s[i+1] === "\n") i++; row.push(cell); cell = ""; if (row.some(x => x.trim() !== "")) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x.trim() !== "")) rows.push(row);
  const head = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}

async function loadData() {
  const tries = [];
  if (CONFIG.SHEET_CSV_URL) tries.push(["srcSheet", CONFIG.SHEET_CSV_URL + (CONFIG.SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now()]);
  if (location.protocol.startsWith("http")) tries.push(["srcFile", "data.csv?t=" + Date.now()]);
  for (const [k, u] of tries) {
    try { const r = await fetch(u, {cache: "no-store"}); if (r.ok) { const s = await r.text(); if (s.includes(",")) return {rows: parseCSV(s), src: k}; } } catch (e) {}
  }
  return {rows: parseCSV($("#seed").textContent.trim()), src: "srcSeed"};
}

async function loadRate() {
  if (location.protocol.startsWith("http") && CONFIG.RATE_URL) {
    try { const r = await fetch(CONFIG.RATE_URL + "?t=" + Date.now(), {cache: "no-store"}); if (r.ok) { const j = await r.json(); if (j.usd_vnd > 0) return j; } } catch (e) {}
  }
  try { const j = JSON.parse($("#rateSeed").textContent); if (j.usd_vnd > 0) return j; } catch (e) {}
  return null;
}

const BINS = [[0,"#fde68a","< 40"],[40,"#fbbf24","40 – 60"],[60,"#f97316","60 – 80"],[80,"#dc2626","80 – 100"],[100,"#7f1d1d","≥ 100"]];
const colorOf = p => { let c = BINS[0][1]; for (const b of BINS) if (p >= b[0]) c = b[1]; return c; };
const UPCOMING = ["Sắp đấu giá", "Chờ kết quả"];
const STATUS_COLOR = {"Sắp đấu giá": "#2563eb", "Chờ kết quả": "#64748b", "Hủy/bỏ cọc": "#111827"};
/* ---------- Màu giao diện từ theme.json / theme colours ---------- */
const THEME_KEYS = ["bg", "bg2", "ink", "mute", "line", "acc", "card"];
const isColor = c => typeof c === "string" && /^#[0-9a-fA-F]{3,8}$/.test(c);
function applyTheme(th) {
  if (!th || typeof th !== "object") return;
  let css = ":root{";
  THEME_KEYS.forEach(k => { const l = th.light && th.light[k], d = th.dark && th.dark[k];
    if (isColor(l) && isColor(d)) css += `--${k}:light-dark(${l},${d});`; else if (isColor(l)) css += `--${k}:${l};`; });
  let st = document.getElementById("themeCss");
  if (!st) { st = document.createElement("style"); st.id = "themeCss"; document.head.appendChild(st); }
  st.textContent = css + "}";
  if (Array.isArray(th.bins)) th.bins.forEach((c, i) => { if (BINS[i] && isColor(c)) BINS[i][1] = c; });
  if (th.status) Object.keys(STATUS_COLOR).forEach(k => { if (isColor(th.status[k])) STATUS_COLOR[k] = th.status[k]; });
}
async function loadTheme() {
  if (!location.protocol.startsWith("http") || !CONFIG.THEME_URL) return null;
  try { const r = await fetch(CONFIG.THEME_URL + "?t=" + Date.now(), {cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  return null;
}
/* xem trước từ trang admin / live preview from admin page */
window.addEventListener("message", e => {
  if (e.origin !== location.origin && !(location.protocol === "file:" && (e.origin === "null" || e.origin === "file://"))) return;
  const m = e.data || {};
  if (m.type === "dg-theme") { applyTheme(m.theme); applyLang(); }
  if (m.type === "dg-mode") document.documentElement.dataset.theme = m.mode || "";
});
const markColor = d => STATUS_COLOR[d.trang_thai] || (d.max != null ? colorOf(d.max) : "#94a3b8");

let DATA = [], SRC = "srcSeed", map, layer, markers = {}, bases, layerCtl, legendCtl, state = {status: "Tất cả"};

function normalize(rows) {
  return rows.filter(r => r.id || r.xa).map((r, i) => ({...r, id: r.id || "row" + i,
    min: num(r.gia_trung_min), max: num(r.gia_trung_max), start: num(r.gia_khoi_diem),
    lat: num(r.lat), lng: num(r.lng), lots: num(r.so_thua), won: num(r.so_thua_trung), total: num(r.tong_tien_ty)}))
    .sort((a, b) => (b.ngay || "").localeCompare(a.ngay || ""));
}

function filtered() {
  const tn = $("#fTinh").value, l = $("#fLoai").value, f = $("#fFrom").value, to = $("#fTo").value, q = $("#fQ").value.trim().toLowerCase();
  return DATA.filter(d => (state.status === "Tất cả" || d.trang_thai === state.status) && (!tn || d.tinh === tn) && (!l || d.loai_dat === l)
    && (!f || d.ngay >= f) && (!to || d.ngay <= to)
    && (!q || [d.xa, d.khu, d.khu_en, d.dia_danh_cu, d.tinh, tv("prov", d.tinh)].join(" ").toLowerCase().includes(q)));
}

function popup(d) {
  const loc = d.vi_tri === "gần đúng" ? t("approx") : d.vi_tri === "chính xác" ? t("exact") : d.vi_tri;
  const rows = [[t("pDate"), fdate(d.ngay)], [t("pOld"), d.dia_danh_cu], [t("pArea"), pick(d, "khu")], [t("pType"), tv("land", d.loai_dat)],
    [t("pPlots"), d.lots != null ? (d.won != null ? `${d.won}/${d.lots} ${t("won")}` : d.lots) : ""], [t("pStart"), d.start != null ? PU(d.start) + VNDnote(fmt(d.start)) : ""],
    [t("pWin"), d.max != null ? (d.min != null ? P(d.min) + " – " : t("highest") + " ") + PU(d.max) + VNDnote((d.min != null ? fmt(d.min) + " – " : "") + fmt(d.max)) : ""],
    [t("pTotal"), TOTAL(d.total)], [t("pPeople"), d.nguoi_tham_gia], [t("pNote"), pick(d, "ghi_chu")], [t("pLoc"), loc]].filter(r => r[1]);
  return `<div class="pop"><h3>${esc(d.xa)}, ${esc(tv("prov", d.tinh))}</h3><span class="tag" style="margin:0 0 6px">${esc(tv("status", d.trang_thai))}</span>
   <table>${rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
   ${d.link ? `<p style="margin:8px 0 0"><a href="${esc(d.link)}" target="_blank" rel="noopener">${t("pSrc")}: ${esc(tv("src", d.nguon) || t("seeArticle"))} ↗</a></p>` : ""}</div>`;
}

function render() {
  const list = filtered();
  const done = list.filter(d => d.trang_thai === "Đã đấu giá" || d.trang_thai === "Đã nộp tiền");
  const maxs = done.map(d => d.max).filter(v => v != null).sort((a, b) => a - b);
  const med = maxs.length ? (maxs.length % 2 ? maxs[(maxs.length - 1) / 2] : (maxs[maxs.length / 2 - 1] + maxs[maxs.length / 2]) / 2) : null;
  $("#stats").innerHTML = `<div><b>${done.length}</b><span>${t("stDone")}</span></div><div><b>${fmt(done.reduce((s, d) => s + (d.won || 0), 0))}</b><span>${t("stWon")}</span></div>
   <div><b>${maxs.length ? P(maxs[maxs.length - 1]) : "—"}</b><span>${U("stMax")}</span></div><div><b>${P(med)}</b><span>${t("stMed")}</span></div>
   <div><b>${list.filter(d => UPCOMING.includes(d.trang_thai)).length}</b><span>${t("stUp")}</span></div>`;
  if (map) {
    layer.clearLayers(); markers = {};
    const pts = [];
    list.forEach(d => { if (d.lat == null || d.lng == null) return;
      const up = UPCOMING.includes(d.trang_thai);
      const r = d.max != null ? 7 + Math.min(10, (d.won || d.lots || 5) / 6) : 8;
      const m = L.circleMarker([d.lat, d.lng], {radius: r, color: up ? markColor(d) : "#0006", weight: up ? 3 : 1, fillColor: markColor(d), fillOpacity: up ? 0.15 : 0.85, dashArray: up ? "4 3" : null})
        .bindPopup(popup(d), {maxWidth: 320}).bindTooltip(`${d.xa} · ${d.max != null ? PU(d.max) : tv("status", d.trang_thai)}`);
      m.on("click", () => highlight(d.id)); layer.addLayer(m); markers[d.id] = m; pts.push([d.lat, d.lng]); });
    if (pts.length && !state.fitted) { map.fitBounds(pts, {padding: [40, 40], maxZoom: 12}); state.fitted = true; }
  }
  $("#list").innerHTML = list.length ? list.map(d => `<div class="item" data-id="${esc(d.id)}" tabindex="0">
    <span class="dot" style="background:${markColor(d)}"></span>
    <div><b>${esc(d.xa)}</b><span class="tag">${esc(tv("status", d.trang_thai))}</span><div class="m">${fdate(d.ngay)} · ${esc(tv("prov", d.tinh))}${d.dia_danh_cu ? " · " + esc(d.dia_danh_cu) : ""}</div>
    <div class="m">${esc(pick(d, "khu") || "")}${d.lots != null ? ` · ${d.won != null ? d.won + "/" : ""}${d.lots} ${t("plots")}` : ""}</div></div>
    <div class="price">${d.max != null ? P(d.max) : d.start != null ? P(d.start) : "—"}<small>${d.max != null ? t("topWin") : d.start != null ? t("startP") : ""}${d.max != null || d.start != null ? " · " + UN() : ""}</small></div></div>`).join("")
    : `<div class="empty">${t("empty")}</div>`;
}

function highlight(id) {
  document.querySelectorAll(".item").forEach(x => x.classList.toggle("on", x.dataset.id === id));
  const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({block: "nearest"});
}

function fillSelect(sel, key, group) {
  const keep = sel.value;
  sel.innerHTML = `<option value="">${t("all")}</option>` + [...new Set(DATA.map(d => d[key]).filter(Boolean))].sort()
    .map(v => `<option value="${esc(v)}">${esc(tv(group, v))}</option>`).join("");
  sel.value = keep;
}

/* Áp dụng ngôn ngữ cho toàn trang / apply language to the whole page */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.innerHTML = v; });
  document.querySelectorAll("[data-lang]").forEach(b => { b.classList.toggle("on", b.dataset.lang === lang); b.setAttribute("aria-pressed", b.dataset.lang === lang); });
  $("#fQ").placeholder = t("searchPh");
  $("#map").setAttribute("aria-label", t("mapLabel"));
  $("#statusChips").setAttribute("aria-label", t("statusGroup"));
  $("#rateinfo").innerHTML = lang === "en" ? (useUSD() ? esc(t("rateLine")(Math.round(RATE.usd_vnd).toLocaleString("en-US"), fdate(RATE.date))) : t("noRate")) : "";
  $("#rateinfo").hidden = lang !== "en";
  $("#contact").innerHTML = CONFIG.FORM_URL ? `<a href="${esc(CONFIG.FORM_URL)}" target="_blank" rel="noopener">${t("formLink")}</a>` : t("formNone");
  $("#statusChips").innerHTML = ["Tất cả", "Đã đấu giá", "Chờ kết quả", "Sắp đấu giá", "Hủy/bỏ cọc"].map(s => `<button class="chip ${s === state.status ? "on" : ""}" data-s="${s}">${esc(tv("status", s))}</button>`).join("");
  if (DATA.length) {
    const last = DATA.filter(d => d.trang_thai === "Đã đấu giá" || d.trang_thai === "Đã nộp tiền").map(d => d.ngay).filter(Boolean).sort().pop();
    $("#updated").textContent = `${DATA.length} ${t("sessions")} · ${t("source")}: ${t(SRC)} · ${t("latest")}: ${fdate(last) || "—"}`
      + (lang === "en" ? (useUSD() ? ` · 1 USD = ${Math.round(RATE.usd_vnd).toLocaleString("en-US")} VND (Vietcombank, ${fdate(RATE.date)})` : "") : "");
    fillSelect($("#fTinh"), "tinh", "prov"); fillSelect($("#fLoai"), "loai_dat", "land");
    const recent = DATA.filter(d => d.trang_thai === "Đã đấu giá").slice(0, 3);
    $("#news").innerHTML = `<b>${t("newsTitle")}</b>` + (recent.map(d => esc(t("newsLine")(fdate(d.ngay), d.xa, PU(d.max)))).join("<br>") || t("none"));
  } else $("#updated").textContent = t("loading");
  if (map) {
    /* nút chọn nền & chú giải dựng lại theo ngôn ngữ */
    if (layerCtl) layerCtl.remove();
    const named = {}; [["baseOSM", "osm"], ["baseHOT", "hot"], ["baseEsri", "esri"], ["baseSat", "sat"]].forEach(([k, id]) => named[t(k)] = bases[id]);
    layerCtl = L.control.layers(named, null, {position: "topright"}).addTo(map);
    if (legendCtl) legendCtl.remove();
    legendCtl = L.control({position: "bottomleft"});
    const binLabel = (b, i) => { if (!useUSD()) return b[2]; const lo = P(b[0]), hi = BINS[i + 1] ? P(BINS[i + 1][0]) : null;
      return i === 0 ? "< " + hi : hi ? lo + " – " + hi : "≥ " + lo; };
    legendCtl.onAdd = () => { const d = L.DomUtil.create("div", "legend"); d.innerHTML = `<b>${U("legendTitle")}</b><br>` + BINS.map((b, i) => `<i style="background:${b[1]}"></i>${binLabel(b, i)}`).join("<br>")
      + `<br><i style="background:transparent;border:2px dashed ${STATUS_COLOR["Sắp đấu giá"]}"></i>${tv("status", "Sắp đấu giá")}<br><i style="background:transparent;border:2px dashed ${STATUS_COLOR["Chờ kết quả"]}"></i>${tv("status", "Chờ kết quả")}`; return d; };
    legendCtl.addTo(map);
  }
  render();
}

async function init() {
  if (window.L) {
    map = L.map("map", {scrollWheelZoom: true}).setView(CONFIG.CENTER, CONFIG.ZOOM);
    const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
    bases = {
      osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: OSM_ATTR}),
      hot: L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {maxZoom: 19, subdomains: "abc", attribution: OSM_ATTR + ', tiles &copy; <a href="https://www.hotosm.org/">HOT</a>'}),
      esri: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors"}),
      sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics"})
    };
    /* OpenStreetMap chặn trang mở trực tiếp từ ổ đĩa (file://) → khi mở file trên máy dùng nền Esri, khi lên web dùng OpenStreetMap */
    (location.protocol.startsWith("http") ? bases.osm : bases.esri).addTo(map);
    layer = L.layerGroup().addTo(map);
  } else { $("#map").innerHTML = `<p class="empty">${t("mapErr")}</p>`; }

  applyLang();
  const [{rows, src}, rate, theme] = await Promise.all([loadData(), loadRate(), loadTheme()]);
  DATA = normalize(rows); SRC = src; RATE = rate; applyTheme(theme);
  applyLang();

  document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; try { localStorage.setItem("dgLang", lang); } catch (er) {} applyLang(); });
  $("#statusChips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; state.status = b.dataset.s;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); render(); });
  ["#fTinh", "#fLoai", "#fFrom", "#fTo", "#fQ"].forEach(s => $(s).addEventListener("input", render));
  $("#list").addEventListener("click", e => { const it = e.target.closest(".item"); if (!it) return; highlight(it.dataset.id);
    const m = markers[it.dataset.id]; if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 13)); m.openPopup(); } });
  $("#list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".item")) e.target.click(); });
}
init();
}
</script>
</body>
</html>
