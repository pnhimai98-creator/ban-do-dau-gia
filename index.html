<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ đấu giá đất Hà Nội & vùng ven | Hanoi Land Auction Map</title>
<meta name="description" content="Bản đồ kết quả và lịch đấu giá quyền sử dụng đất tại Hà Nội và các tỉnh lân cận. Map of land-use-right auction results and schedules in Hanoi and neighbouring provinces.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121417);--bg2:light-dark(#f3f4f2,#1a1d21);--ink:light-dark(#161a1d,#e9ecef);--mute:light-dark(#5c6670,#9aa3ad);--line:light-dark(#dde1e0,#2b3137);--acc:light-dark(#1f5f4a,#7fd1b0);--card:light-dark(#fff,#181b1f)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;padding:16px max(3vw,14px) 10px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div b{display:block;font-size:20px;line-height:1.1}
.stats div span{font-size:12px;color:var(--mute)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 84px);min-height:560px}
#map{height:100%;z-index:1}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label{font-size:12px;color:var(--mute);display:grid;gap:3px}
.filters .full{grid-column:1/-1}
select,input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);padding:0 10px;font-size:16px;width:100%}
/* nút chọn lớp & ô tick không bị kéo to theo ô nhập liệu */
.leaflet-control-layers input,.anachk input{height:auto;width:auto;padding:0;margin:0 6px 0 0;border:0;vertical-align:-2px}
.leaflet-control-layers-expanded{padding:10px 14px 10px 10px;min-width:250px;max-height:72vh;overflow:auto}
.leaflet-control-layers label{font-size:14px;line-height:1.85}
.leaflet-control-layers-separator{margin:6px -14px 6px -10px}
.leaflet-control-layers-toggle{width:40px;height:40px}
.rr-lbl span{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#c2410c;border:2px solid #c2410c;border-radius:5px;padding:0 6px;font:700 12px/17px "Be Vietnam Pro",system-ui,sans-serif;white-space:nowrap;box-shadow:0 1px 3px #0003}
.z-lt10 .lbl-ql,.z-lt12 .lbl-dt{display:none}
.lg-line{display:inline-block;width:22px;height:0;border-top:3px solid #495057;margin-right:6px;vertical-align:3px}
.ap-ic span{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:16px;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.anachk{font-size:13px;color:var(--mute);display:inline-flex;align-items:center;cursor:pointer}
.tag.bad{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.tag.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{overflow:auto;flex:1}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.item:hover,.item.on{background:var(--bg2)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;border:2px solid #0003}
.item b{font-size:15px}
.item .m{font-size:13px;color:var(--mute)}
.price{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:1px 7px;background:var(--bg2);border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.legend{background:var(--card);color:var(--ink);padding:8px 10px;border-radius:8px;box-shadow:0 2px 10px #0003;font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.leaflet-popup-content{font:14px/1.5 "Be Vietnam Pro",system-ui,sans-serif;margin:12px 14px}
.pop h3{margin:0 0 4px;font-size:16px}
.pop table{border-collapse:collapse;width:100%;font-size:13px}
.pop td{padding:2px 0;vertical-align:top}.pop td:first-child{color:#667;padding-right:10px;white-space:nowrap}
.news{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.news b{display:block;margin-bottom:2px}
.news .nl{margin:3px 0;line-height:1.45}.news .nl a{text-decoration:none}.news .nl a:hover{text-decoration:underline}.news .nl .go{color:var(--ink)}.news .nl .src{white-space:nowrap;font-size:12px}
footer{padding:16px max(3vw,14px);font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
.empty{padding:24px 14px;color:var(--mute)}
@media(max-width:860px){.layout{grid-template-columns:1fr;height:auto}#map{height:58vh}aside{border-left:0}.list{max-height:none;overflow:visible}header{align-items:flex-start}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:0 12px;height:32px;font-size:13px;font-weight:600;cursor:pointer;min-width:44px}
.lang button.on{background:var(--ink);color:var(--bg)}
/* ---- Phân tích giá / price analysis ---- */
.ana{padding:22px max(3vw,14px) 8px;border-top:1px solid var(--line);
 --s1:light-dark(#2a78d6,#3987e5);--s2:light-dark(#eb6834,#d95926);--s3:light-dark(#1baf7a,#199e70);--s4:light-dark(#eda100,#c98500);--s5:light-dark(#e87ba4,#d55181);--s6:light-dark(#008300,#0ca30c);--s7:light-dark(#6250d6,#9085e9);--s8:light-dark(#e34948,#e66767)}
.ana h2{font-size:20px;margin:0}.ana h3{font-size:16px;margin:0 0 8px}
.ana .sub{margin:2px 0 12px}
.anabar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;padding:0 12px;height:32px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.achip{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:30px}
.achip i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.achip.on{border-color:var(--ink);font-weight:600}
.achip small{color:var(--mute);font-weight:400}
/* xóa đường kẻ trắng giữa các ô bản đồ khi trình duyệt phóng to/thu nhỏ (zoom 90%, 125%…): cho mỗi ô chồng lên nhau nửa điểm ảnh */
.leaflet-tile-container img.leaflet-tile{width:256.5px!important;height:256.5px!important}
.chartbox{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;background:var(--card)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox .grid line{stroke:var(--line);stroke-width:1}
.chartbox svg text{font-family:"Be Vietnam Pro",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chartbox .ax text{fill:var(--mute);font-size:10.5px;letter-spacing:-.1px}
.chartbox .lbl{font-size:11.5px;fill:var(--ink);font-weight:600}
.chartbox .pt{stroke:var(--card);stroke-width:2;cursor:pointer}
.chartbox .pt:hover{stroke:var(--ink)}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:8px;max-width:260px;z-index:5;box-shadow:0 4px 14px #0003}
.anagrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.rank[hidden]{display:none}.rank{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);overflow:auto}
.rank table{border-collapse:collapse;width:100%;font-size:13px}
.rank th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rank td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.rank td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank th.n{text-align:right}
.rank tr[data-id]{cursor:pointer}.rank tr[data-id]:hover td{background:var(--bg2)}
.rank .k{color:var(--mute);font-size:12px}
.bar{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--acc);opacity:.55;vertical-align:middle;margin-right:6px}
.noda{color:var(--mute);font-size:13px;padding:18px 4px}
@media(max-width:860px){.anagrid{grid-template-columns:1fr}}
/* ---- Báo cáo định kỳ / reports ---- */
.repbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:99px;background:var(--acc);color:var(--bg);font-size:13px;font-weight:600;text-decoration:none;flex:none}
.repbtn span{background:var(--bg);color:var(--acc);border-radius:99px;padding:0 6px;font-size:11px;line-height:17px}
.replist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.repcard{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;text-align:left;font:inherit}
.repcard:hover{border-color:var(--acc)}
.repcard .ic{grid-row:span 3;width:44px;height:54px;border-radius:6px;background:#c92a2a;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.repcard b{font-size:15px;line-height:1.35}.repcard .k{font-size:12.5px;color:var(--mute)}
.repcard.new{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
#pdfDlg{width:min(1100px,96vw);height:92vh;padding:0;border:0;border-radius:12px;background:var(--card);color:var(--ink);overflow:hidden}
#pdfDlg::backdrop{background:#000a}
#pdfDlg .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
#pdfDlg .bar b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdfDlg .bar a{font-size:13px;white-space:nowrap}
#pdfDlg .bar button{border:1px solid var(--line);background:none;border-radius:8px;height:32px;min-width:36px;cursor:pointer}
/* ---- Dự án thấp tầng / low-rise projects ---- */
.pj-wrap{font-size:12px;color:var(--mute);display:grid;gap:3px}
.pj-find{position:relative;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
.pj-find:focus-within{border-color:var(--acc)}
.pj-find .pj-bar{display:flex;align-items:center;height:100%;padding:0 4px}
.pj-find button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;flex:none}
.pj-find button:hover{background:var(--line)}
.pj-find button svg{width:17px;height:17px;stroke:var(--ink)}
.pj-find .pj-bar input{flex:1;min-width:0;height:38px;padding:0 6px;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px}
.pj-find ul{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:2000;list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;background:var(--card);border-radius:10px;box-shadow:0 6px 20px #0003}
.pj-find ul:not(:empty){border:1px solid var(--line);padding:4px 0}
.pj-find li{padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink)}.pj-find li:hover,.pj-find li.on{background:var(--bg2)}.pj-find li small{display:block;color:var(--mute)}
.pj-ic i{display:block;border-radius:2px;box-sizing:border-box;box-shadow:0 0 0 1px #0003}
.pj-sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin:0 6px 0 2px;vertical-align:-1px;box-sizing:border-box}
.legend i.sq{border-radius:2px}
.rk-pj td.r b{display:inline-block;min-width:44px;text-align:right}
.rk-pj .lo{color:#15803d}.rk-pj .mid{color:#b45309}.rk-pj .hi{color:#b91c1c}
/* dòng độ tin cậy thấp không làm mờ nữa – đã có nhãn "Thấp" ở cột Độ tin cậy */
.rk-pj .rel{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;border:1px solid var(--line)}.rk-pj .rel.hi{background:#dcfce7;color:#166534;border-color:#bbf7d0}.rk-pj .rel.mid{background:#fef3c7;color:#92400e;border-color:#fde68a}.rk-pj .rel.lo{background:var(--bg2)}
.rk-pj tr[data-h]{cursor:pointer}.rk-pj tr[data-h]:hover td{background:var(--bg2)}
#pdfDlg iframe{width:100%;height:calc(100% - 49px);border:0;background:#525659}
#repDlg{width:min(820px,96vw);max-height:88vh;padding:0;border:0;border-radius:12px;background:var(--card);color:var(--ink);overflow:hidden;display:none;flex-direction:column}
#repDlg[open]{display:flex}
#repDlg::backdrop{background:#0008}
#repDlg .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);height:auto;width:auto;margin:0;background:none;opacity:1;border-radius:0;vertical-align:baseline}
#repDlg .bar b{flex:1;font-size:16px}
#repDlg .bar button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;height:32px;min-width:36px;cursor:pointer}
#repDlgBody{overflow:auto;padding:4px 16px 18px}
#repDlgBody h3{font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
#repDlgBody h3 span{font-weight:400;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header>
 <div><div class="htop"><h1 data-t="title">Bản đồ đấu giá đất Hà Nội & vùng ven</h1>
  <div class="lang" role="group" aria-label="Ngôn ngữ / Language"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
  <a class="repbtn" id="repBtn" href="#reports" hidden></a></div>

  <div class="filters">
   <div class="full chips" id="statusChips" role="group"></div>

   <div class="full pj-wrap" id="pjWrap" hidden><span data-t="pjFind">Tìm dự án</span><div class="pj-find" id="pjFind"></div></div>
  </div>
  <div class="news" id="news"></div>
  <div class="list" id="list" aria-live="polite"></div>
 </aside>
</div>
<section class="ana" id="ana" aria-labelledby="anaT">

 </div>
 <div class="chartbox" id="chartbox"><div id="chart"></div><div class="ctip" id="ctip" hidden></div></div>

  <div class="rank"><h3 data-t="rk1"></h3><div id="rk1"></div></div>
  <div class="rank"><h3 data-t="rk2"></h3><div id="rk2"></div></div>
  <div class="rank" id="rk3box"><h3 data-t="rk3"></h3><div id="rk3"></div></div>
 </div>
</section>
<section class="ana" id="pjcmp" hidden aria-labelledby="pjT">
 <h2 id="pjT" data-t="pjTitle"></h2><p class="sub" id="pjSub"></p>
 <div class="rank rk-pj" id="pjTable"></div>
</section>
<section class="ana" id="reports" aria-labelledby="repT">
 <h2 id="repT" data-t="repTitle"></h2><p class="sub" data-t="repSub"></p>
 <div id="repList"></div>
</section>
<dialog id="pdfDlg" aria-labelledby="pdfTitle">
 <div class="bar"><b id="pdfTitle"></b><a id="pdfOpen" target="_blank" rel="noopener"></a><a id="pdfDown" download></a><button id="pdfClose" type="button" aria-label="Đóng / Close">✕</button></div>
 <iframe id="pdfFrame" title="PDF"></iframe>
</dialog>
<dialog id="repDlg" aria-labelledby="repDlgT">
 <div class="bar"><b id="repDlgT"></b><button id="repDlgClose" type="button" aria-label="Đóng / Close">✕</button></div>
 <div id="repDlgBody"></div>
</dialog>
<footer>
 <p data-t="footer"></p>
 <p id="rateinfo" hidden></p>
 <p><span data-t="report"></span> <span id="contact"></span></p>
</footer>

const MT_KEY = "dgMT1"; let MT = {}; const mtWait = {};
try { MT = JSON.parse(localStorage.getItem(MT_KEY) || "{}") || {}; } catch (e) {}
function mt(s) {
  if (!s) return Promise.resolve(null);
  if (MT[s]) return Promise.resolve(MT[s]);
  if (mtWait[s]) return mtWait[s];
  const u = "https://api.mymemory.translated.net/get?langpair=vi%7Cen&q=" + encodeURIComponent(s.slice(0, 480))
    + (CONFIG.TRANSLATE_EMAIL ? "&de=" + encodeURIComponent(CONFIG.TRANSLATE_EMAIL) : "");
  return mtWait[s] = fetch(u).then(r => r.json()).then(j => {
      const out = j && +j.responseStatus === 200 && j.responseData && j.responseData.translatedText;
      if (!out || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(out)) return null;
      MT[s] = out; try { localStorage.setItem(MT_KEY, JSON.stringify(MT)); } catch (e) {}
      return out;
    }).catch(() => null).finally(() => { delete mtWait[s]; });
}

const P = v => v == null ? "—" : useUSD() ? "$" + usdM2(v).toLocaleString("en-US") : fmt(v);   // số giá (không đơn vị)

const U = k => t(k).replace("{u}", UN());

function parseCSV(s) {
  const rows = []; let row = [], cell = "", q = false;
  s = s.replace(/^﻿/, "");
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && s[i+1] === "\n") i++; row.push(cell); cell = ""; if (row.some(x => x.trim() !== "")) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x.trim() !== "")) rows.push(row);
  const head = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}

function niceTicks(lo, hi, n) { const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));

/* Tách các chấm trùng chỗ (nhiều phiên cùng tâm xã/thôn): xếp quanh một vòng nhỏ, tính lại khi phóng to/thu nhỏ */
function spreadMarkers() {
  if (!map) return; const ms = Object.values(markers); if (!ms.length) return;
  ms.forEach(m => { if (!m._base) m._base = m.getLatLng(); });
  const P = ms.map(m => map.latLngToLayerPoint(m._base)), used = new Array(ms.length).fill(false), GAP = 16;
  for (let i = 0; i < ms.length; i++) { if (used[i]) continue;
    const grp = [i]; used[i] = true;
    for (let j = i + 1; j < ms.length; j++) if (!used[j] && grp.some(k => P[k].distanceTo(P[j]) < GAP)) { grp.push(j); used[j] = true; }
    if (grp.length === 1) { ms[i].setLatLng(ms[i]._base); continue; }
    const c = grp.reduce((s, k) => s.add(P[k]), L.point(0, 0)).divideBy(grp.length), R = Math.max(14, grp.length * 5.5);
    grp.forEach((k, n) => { const a = 2 * Math.PI * n / grp.length - Math.PI / 2; ms[k].setLatLng(map.layerPointToLatLng(c.add(L.point(R * Math.cos(a), R * Math.sin(a))))); });
  }

  $("#statusChips").innerHTML = ["Tất cả", "Đã đấu giá", "Chờ kết quả", "Đấu giá lại", "Sắp đấu giá", "Hủy/bỏ cọc"].map(s => `<button class="chip ${s === state.status ? "on" : ""}" data-s="${s}">${esc(tv("status", s))}</button>`).join("");
  if (DATA.length) {
    const last = DATA.filter(d => d.trang_thai === "Đã đấu giá" || d.trang_thai === "Đã nộp tiền").map(d => d.ngay).filter(Boolean).sort().pop();
    $("#updated").textContent = `${DATA.length} ${t("sessions")} · ${t("source")}: ${t(SRC)} · ${t("latest")}: ${fdate(last) || "—"}`
      + (lang === "en" ? (useUSD() ? ` · 1 USD = ${Math.round(RATE.usd_vnd).toLocaleString("en-US")} VND (Vietcombank, ${fdate(RATE.date)})` : "") : "");
    fillSelect($("#fTinh"), "tinh", "prov"); fillSelect($("#fLoai"), "loai_dat", "land");
    const recent = DATA.filter(d => d.trang_thai === "Đã đấu giá").slice(0, 3);
    /* mỗi tin: bấm dòng chữ → tới điểm trên bản đồ; bấm tên báo → mở bài gốc */
    $("#news").innerHTML = `<b>${t("newsTitle")}</b>` + (recent.map(d => {
      const line = d.max != null ? t("newsLine")(fdate(d.ngay), d.xa, PU(d.max)) : t("newsLine2")(fdate(d.ngay), d.xa, d.won || d.lots);
      return `<div class="nl"><a href="#" class="go" data-go="${esc(d.id)}" title="${esc(t("newsGo"))}">${esc(line)}</a>${d.link ? ` · <a class="src" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(tv("src", d.nguon) || t("seeArticle"))} ↗</a>` : ""}</div>`; }).join("") || t("none"));
  } else $("#updated").textContent = t("loading");
  if (map) {
    /* nút chọn nền & chú giải dựng lại theo ngôn ngữ */
    if (layerCtl) layerCtl.remove();
    const named = {}; [["baseCarto", "carto"], ["baseOSM", "osm"], ["baseHOT", "hot"], ["baseEsri", "esri"], ["baseSat", "sat"]]
      .filter(([, id]) => location.protocol.startsWith("http") || id !== "osm")   /* mở file trên máy: OpenStreetMap chặn (ô "Access blocked") → ẩn lựa chọn này */
      .forEach(([k, id]) => named[t(k)] = bases[id]);
    const ov = {}; Object.keys(decvGroups).forEach(k => { const f = decvGroups[k].getLayers()[0]; const c = (f && f.feature.properties.color) || "#7c3aed";
      ov[`<i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin:0 5px 0 2px;vertical-align:-1px"></i>${esc(t("decv"))} · ${esc(k)}`] = decvGroups[k]; });
    const sw = (c, line, dash) => `<i style="display:inline-block;width:20px;height:${line ? 0 : 12}px;${line ? `border-top:${line}px ${dash ? "dashed" : "solid"} ${c}` : `background:${c}`};border-radius:2px;margin:0 6px 0 2px;vertical-align:${line ? 4 : -1}px"></i>`;
    const metroSw = `<i style="display:inline-block;width:20px;height:5px;border-radius:2px;margin:0 6px 0 2px;vertical-align:3px;background:linear-gradient(90deg,${Object.values(METRO_COLOR).join(",")})"></i>`;
    const ex = {};
    if (extraGroups.tinh) ex[sw("#343a40", 3) + esc(t("lyProv"))] = extraGroups.tinh;
    if (extraGroups.huyen) ex[sw("#7048e8", 2, true) + esc(t("lyDist"))] = extraGroups.huyen;
    if (extraGroups.bound) ex[sw("#6b7280", 2, true) + esc(t("lyBound"))] = extraGroups.bound;
    INFRA_KEYS.forEach(([k, lk]) => {
      if (k === "vanh_dai") {   /* mỗi địa phương một dòng, màu riêng */
        Object.keys(extraGroups).filter(x => x.startsWith("vanh_dai:")).sort((a, b) => REGION_ORDER(a.slice(9)).localeCompare(REGION_ORDER(b.slice(9)), "vi"))
          .forEach(x => { ex[sw(regionColor(x.slice(9)), 4) + esc(t(lk)) + " – " + esc(regionName(x.slice(9)))] = extraGroups[x]; });
        return;
      }
      if (!extraGroups[k]) return;
      const icon = k === "metro" ? metroSw : k === "san_bay" ? `<span style="display:inline-block;width:20px;margin:0 6px 0 2px;text-align:center">✈</span>` : sw(INFRA_STYLE[k].color, k.startsWith("cau") ? 6 : k === "duong_tinh" ? 3 : 4, k === "cau_xay");
      ex[icon + esc(t(lk))] = extraGroups[k]; });
    [["so_cap", "lyPjSC"], ["thu_cap", "lyPjTC"], ["tuong_lai", "lyPjTL"]]
      .forEach(([k, lk]) => { if (projGroups[k]) ex[`<i class="pj-sw" style="${pjStyle(k)}"></i>` + esc(t(lk))] = projGroups[k]; });
    refreshRingLabels();
    layerCtl = L.control.layers(named, {...ex, ...ov}, {position: "topright"}).addTo(map);
    if (legendCtl) legendCtl.remove();
    legendCtl = L.control({position: "bottomleft"});
    const binLabel = (b, i) => { if (!useUSD()) return b[2]; const lo = P(b[0]), hi = BINS[i + 1] ? P(BINS[i + 1][0]) : null;
      return i === 0 ? "< " + hi : hi ? lo + " – " + hi : "≥ " + lo; };
    legendCtl.onAdd = () => { const d = L.DomUtil.create("div", "legend"); d.innerHTML = `<b>${U("legendTitle")}</b><br>` + BINS.map((b, i) => `<i style="background:${b[1]}"></i>${binLabel(b, i)}`).join("<br>")
      + `<br><i style="background:transparent;border:2px dashed ${STATUS_COLOR["Sắp đấu giá"]}"></i>${tv("status", "Sắp đấu giá")}<br><i style="background:transparent;border:2px dashed ${STATUS_COLOR["Chờ kết quả"]}"></i>${tv("status", "Chờ kết quả")}<br><i style="background:transparent;border:2px dashed ${STATUS_COLOR["Đấu giá lại"]}"></i>${tv("status", "Đấu giá lại")}`
      + `<br><i style="background:${STATUS_COLOR["Hủy/bỏ cọc"]};border:1px solid #0006"></i>${tv("status", "Hủy/bỏ cọc")}`; return d; };
    if (CONFIG.SHOW_LEGEND) legendCtl.addTo(map);
  }
  render();
  renderReports();
}

async function init() {
  if (window.L) {
    map = L.map("map", {scrollWheelZoom: true}).setView(CONFIG.CENTER, CONFIG.ZOOM);
    const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
    bases = {
      /* nền mặc định: CARTO Voyager (miễn phí, dữ liệu OSM, kết xuất đồng đều – không bị mảng rừng xanh vuông vức do ô OSM kết xuất lệch thời điểm) */
      carto: L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {maxZoom: 20, subdomains: "abcd", attribution: OSM_ATTR + ' &copy; <a href="https://carto.com/attributions">CARTO</a>'}),
      osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: OSM_ATTR}),
      hot: L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {maxZoom: 19, subdomains: "abc", attribution: OSM_ATTR + ', tiles &copy; <a href="https://www.hotosm.org/">HOT</a>'}),
      esri: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors"}),
      sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics"})
    };
    /* OpenStreetMap chặn trang mở trực tiếp từ ổ đĩa (file://) → khi mở file trên máy dùng nền Esri, khi lên web dùng OpenStreetMap */
    (location.protocol.startsWith("http") ? bases.carto : bases.esri).addTo(map);
    /* nền lỗi tải nhiều ô (máy chủ chặn / sập) → tự chuyển sang nền khác; OSM không cho dùng khi mở file trên máy */
    const FALLBACK = {carto: "esri", osm: "carto", hot: "carto", esri: "carto"};
    let switched = 0;   /* chỉ tự đổi tối đa 2 lần – mất mạng hẳn thì không đổi qua lại mãi */
    Object.entries(bases).forEach(([id, b]) => { let err = 0;
      b.on("tileerror", () => { if (++err === 6 && map.hasLayer(b) && FALLBACK[id] && switched++ < 2) { map.removeLayer(b); bases[FALLBACK[id]].addTo(map); } });
      b.on("add", () => { err = 0; if (id === "osm" && !location.protocol.startsWith("http")) setTimeout(() => { map.removeLayer(b); bases.esri.addTo(map); }, 0); }); });
    layer = L.layerGroup().addTo(map);
    map.on("zoomend", spreadMarkers);
    map.on("popupopen", e => { const el = e.popup.getElement(); translatePopup(el);
      el.querySelectorAll("[data-go]").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); goTo(a.dataset.go); })); });
  } else { $("#map").innerHTML = `<p class="empty">${t("mapErr")}</p>`; }

  applyLang();
  const [{rows, src}, rate, theme, reps] = await Promise.all([loadData(), loadRate(), loadTheme(), loadReports(), loadDecv(), loadExtraLayers(), loadProjects()]);
  DATA = linkRelated(normalize(rows)); SRC = src; RATE = rate; REPORTS = reps; applyTheme(theme);
  applyLang();

  document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; try { localStorage.setItem("dgLang", lang); } catch (er) {} applyLang(); });
  $("#statusChips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; state.status = b.dataset.s;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); render(); });
  ["#fTinh", "#fLoai", "#fFrom", "#fTo", "#fQ"].forEach(s => $(s).addEventListener("input", render));
  $("#anaClean").addEventListener("change", renderAna);
  $("#list").addEventListener("click", e => { const it = e.target.closest(".item"); if (!it) return; highlight(it.dataset.id);
    const m = markers[it.dataset.id]; if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 13)); m.openPopup(); } });
  $("#news").addEventListener("click", e => { const a = e.target.closest("[data-go]"); if (!a) return; e.preventDefault(); goTo(a.dataset.go); });
  $("#list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".item")) e.target.click(); });
}
initAna();
initReports();
initProjCmp();
init();
}
</script>
<script src="tin-ha-tang.js" defer></script>
