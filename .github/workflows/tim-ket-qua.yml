name: Tìm kết quả đấu giá (phiên đã qua ngày) & tọa độ theo thôn

on:
  workflow_dispatch:        # bấm "Run workflow" trong tab Actions để chạy ngay
  schedule:
    - cron: "13 0 * * *"    # 07:13 sáng (giờ VN) mỗi ngày, sau workflow gom tin

permissions:
  contents: write

concurrency:
  group: fetch-news         # dùng chung nhóm với "Gom tin đấu giá từ báo" để hai workflow không ghi đè nhau
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tìm bài kết quả cho các phiên "Chờ kết quả"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # có → Claude đọc bài
          MAX_SESSIONS: "25"
          TIME_BUDGET_MIN: "15"
        run: python scripts/tim_ket_qua.py
      - name: Đọc lại bài gốc, điền các ô còn thiếu của tin chờ duyệt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # có → Claude đọc bài
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TIME_BUDGET_MIN: "8"
        run: python scripts/dien_tin_cho_duyet.py
      - name: Đặt tọa độ theo thôn/khu cho các phiên còn ở tâm xã
        env:
          MAX_GEOCODE: "30"
          TIME_BUDGET_MIN: "6"
        run: python scripts/toa_do_thon.py
      - name: Lưu lên repo
        if: always()          # kể cả khi bước trước lỗi/quá giờ vẫn lưu phần đã làm được
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add cho-duyet.csv data.csv data/
          if git diff --cached --quiet; then echo "Không có thay đổi"; else
            git commit -m "Kết quả đấu giá tìm được & tọa độ theo thôn"
            git pull --rebase
            git push
          fi
