name: Tự đọc bài & điền tin chờ duyệt

on:
  workflow_dispatch:          # bấm "Run workflow" để chạy ngay
  schedule:
    - cron: "41 */3 * * *"    # 3 tiếng một lần
  push:
    paths:
      - cho-duyet.csv         # có tin chờ duyệt mới / bị sửa → điền ngay

permissions:
  contents: write

concurrency:
  group: fetch-news           # chung nhóm với các workflow gom tin, tìm kết quả → không ghi đè nhau
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Đọc lại bài gốc, điền các ô còn thiếu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # có → Gemini (miễn phí) đọc bài
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}   # không bắt buộc; có thì đọc nhanh hơn
        run: python scripts/dien_tin_cho_duyet.py
      - name: Lưu lên repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add cho-duyet.csv
          if git diff --cached --quiet; then echo "Không có ô nào được điền thêm"; else
            git commit -m "Tự điền tin chờ duyệt từ bài báo"
            git pull --rebase
            git push
          fi
