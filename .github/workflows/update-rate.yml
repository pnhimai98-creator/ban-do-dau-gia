name: Cap nhat ty gia Vietcombank

on:
  schedule:
    - cron: "20 1 * * *"
    - cron: "20 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lay ty gia
        run: python scripts/update_rate.py
      - name: Luu rate.json neu co thay doi
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rate.json
          if git diff --cached --quiet; then
            echo "Ty gia khong doi."
          else
            git commit -m "Cap nhat ty gia Vietcombank $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git push
          fi
