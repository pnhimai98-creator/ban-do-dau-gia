name: Cập nhật dữ liệu dự án thấp tầng (từ file Excel báo cáo)

on:
  workflow_dispatch:          # bấm "Run workflow" trong tab Actions để chạy tay
  push:
    paths:
      - "data/bao-cao-du-an.xlsx"   # tự chạy mỗi khi tải file Excel mới lên
  schedule:
    - cron: "17 20 * * *"     # 3:17 sáng (giờ VN) mỗi ngày: tìm tiếp địa chỉ dự án còn thiếu

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Tìm toạ độ theo tên dự án (Gemini + Google Search, OpenStreetMap) và tạo du-an.csv, du-an-huyen.csv
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}   # không bắt buộc: khoá Google Maps (Places API) để tra thêm trên Google Maps
        run: python scripts/nhap_du_an.py
      - name: Lưu lên repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add du-an.csv du-an-huyen.csv data/bao-cao-du-an.xlsx
          if git diff --cached --quiet; then echo "Không có thay đổi"; else
            git commit -m "Cập nhật dữ liệu dự án thấp tầng"
            git pull --rebase
            git push
          fi
